<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Work — Dhruvil Patel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #d8ecd4 0%, #e8f3e5 40%, #cfe4d8 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; color: #1c3020;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(82,140,82,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(82,140,82,0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    p { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #6aaa70; }
    a {
      color: #2e5c30; text-decoration: none; font-size: 13px; font-weight: 500;
      background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(12px); padding: 10px 22px; border-radius: 50px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <p>Coming soon</p>
  <a href="index.html">← Back home</a>
</body>
</html>
